<!DOCTYPE html>
<html lang="en"><head>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{--bg:#F7F5F0;--sf:#FFF;--st:#EFECE6;--ink:#1C1B18;--mut:#68645E;--bd:#E2DDD4;--due:#C84B31;--ok:#2D6A4F;--warn:#B45309;--ind:#3730A3}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;padding-bottom:env(safe-area-inset-bottom)}

<body><div id="root"></div>

<script>
/* ===== PURE CORE (no React) — also used by the QA suite ===== */
window.AX=(()=>{
const toPaise=v=>{const n=parseFloat(String(v==null?'':v).replace(/[₹,\s]/g,''));return isNaN(n)?NaN:Math.round(n*100)};
const inr=p=>(p<0?'-':'')+'₹'+(Math.abs(p)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ord=n=>{const m=n%100;if(m>=11&&m<=13)return n+'th';return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th')};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function parseRows(text){
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const d=first.includes('\t')&&(first.match(/\t/g).length>=(first.match(/,/g)||[]).length)?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  row.push(f);rows.push(row);
  return rows.filter(r=>r.some(x=>x.trim()));
}
function matchCard(account,cards){
  const a=(account||'').trim().toLowerCase();if(!a)return null;
  const names=c=>[c.name,...(c.aliases||[])].map(s=>s.trim().toLowerCase()).filter(Boolean);
  for(const c of cards)if(names(c).includes(a))return c.id;
  for(const c of cards)if(names(c).some(n=>n.length>=3&&(a.includes(n)||n.includes(a))))return c.id;
  return null;
}
const fp=t=>[t.date,t.time,t.place,t.paise,t.drcr,t.account].map(x=>String(x).trim().toLowerCase()).join('|');
function parseAxio(text,cards){
  const rows=parseRows(text||'');const out=[];const skipped={zero:0,footer:0,neg:0};
  const hi=rows.findIndex(r=>r.some(c=>/^date$/i.test(c.trim())));if(hi<0)return{rows:out,skipped,error:'No DATE header found'};
  const H={};rows[hi].forEach((c,i)=>H[c.trim().toUpperCase()]=i);
  const g=(r,k)=>H[k]==null?'':(r[H[k]]||'').trim();
  for(const r of rows.slice(hi+1)){
    if(r.some(c=>/powered by axio/i.test(c))||/axio\.co\.in/i.test(r.join(' '))){skipped.footer++;continue}
    let raw=g(r,'AMOUNT')||g(r,'EXPENSE')||g(r,'INCOME');let p=toPaise(raw);
    if(isNaN(p))continue;
    let drcr=g(r,'DR/CR').toUpperCase()||(g(r,'INCOME')&&!g(r,'EXPENSE')?'CR':'DR');
    if(p===0){skipped.zero++;continue}
    if(drcr==='DR'&&p<0){drcr='CR';p=Math.abs(p);skipped.neg++}
    else if(p<0)p=Math.abs(p);
    const t={date:g(r,'DATE'),time:g(r,'TIME'),place:g(r,'PLACE'),paise:p,drcr,account:g(r,'ACCOUNT'),category:g(r,'CATEGORY'),tags:g(r,'TAGS'),note:g(r,'NOTE'),memo:''};
    t.fp=fp(t);t.id=uid();t.cardId=matchCard(t.account,cards);out.push(t);
  }
  return{rows:out,skipped};
}
const net=(cid,tx)=>tx.filter(t=>t.cardId===cid).reduce((s,t)=>s+(t.drcr==='DR'?t.paise:-t.paise),0);
function subset(items,target,max=5){ // items:[{id,paise}] -> ids[]|null, exact integer paise
  const a=items.filter(i=>i.paise>0&&i.paise<=target).sort((x,y)=>y.paise-x.paise);let hit=null,n=0;
  (function go(i,sum,pick){if(hit||n++>200000)return;if(sum===target){hit=pick.slice();return}
    if(i>=a.length||pick.length>=max||sum>target)return;
    pick.push(a[i].id);go(i+1,sum+a[i].paise,pick);pick.pop();go(i+1,sum,pick)})(0,0,[]);
  return hit;
}
const used=(links,key,id)=>links.filter(l=>l[key]===id).reduce((s,l)=>s+l.amountPaise,0);
const spendLeft=(t,links)=>t.paise-used(links,'spendId',t.id);
const creditLeft=(t,links)=>t.paise-used(links,'creditId',t.id);
function autoMatch(cards,tx,links){
  const nl=[];let all=links.slice();
  for(const c of cards){
    for(const cr of tx.filter(t=>t.cardId===c.id&&t.drcr==='CR')){
      let need=creditLeft(cr,all);if(need<=0)continue;
      const open=()=>tx.filter(t=>t.cardId===c.id&&t.drcr==='DR'&&spendLeft(t,all)>0).map(t=>({id:t.id,paise:spendLeft(t,all)}));
      const ids=subset(open(),need);
      if(ids){for(const id of ids){const amt=open().find(o=>o.id===id).paise;const l={id:uid(),spendId:id,creditId:cr.id,amountPaise:amt};nl.push(l);all=[...all,l]}}
    }}
  return nl;
}
return{toPaise,inr,ord,uid,parseRows,parseAxio,matchCard,net,subset,autoMatch,spendLeft,creditLeft,fp};
})();
</script>

<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;const {inr,ord,uid,parseAxio,net,subset,autoMatch,spendLeft,creditLeft,toPaise}=AX;
const KEY='axio_ledger_state_v1',CFG='axio_ledger_settings_v1';
const SAMPLE=`DATE\tTIME\tPLACE\tAMOUNT\tDR/CR\tACCOUNT\tEXPENSE\tINCOME\tCATEGORY\tTAGS\tNOTE
2026-11-01\t10:12\tAMAZON IN\t1499.00\tDR\tICICI credit 8007\t1499.00\t\tShopping\t\t
2026-11-03\t20:40\tSWIGGY\t640.50\tDR\tICICI credit 8007\t640.50\t\tFood\t\t
2026-11-05\t07:55\tUBER\t859.50\tDR\tICICI credit 8007\t859.50\t\tTravel\t\t
2026-11-07\t11:00\tAMAZON REFUND\t-0.50\tDR\tICICI credit 8007\t-0.50\t\t\t\t
2026-11-08\t11:05\tAMAZON PAY IN G\t0\tDR\tICICI credit 8007\t0\t\t\t\t
2026-11-10\t09:00\tCRED PAYMENT\t2999.00\tCR\tICICI credit 8007\t\t2999.00\tBills\t\t
2026-11-12\t18:30\tTITAN\t12500.00\tDR\tSBI Titan RuPay\t12500.00\t\tShopping\t\tmampi to pay
2026-11-15\t13:10\tONECARD FUEL\t500.00\tDR\tOneCard Metal\t500.00\t\tFuel\t\t
POWERED BY axio https://axio.co.in`;
const seedCards=()=>[
 {id:uid(),name:'ICICI Amazon Pay (8007)',limit:20000000,stmt:11,due:1,color:'#C84B31',aliases:['ICICI credit 8007','ICICI 8007','Amazon Pay','8007'],archived:false},
 {id:uid(),name:'SBI Titan RuPay',limit:15000000,stmt:22,due:12,color:'#2D6A4F',aliases:['SBI Titan','Titan RuPay'],archived:false},
 {id:uid(),name:'OneCard Metal',limit:30000000,stmt:3,due:23,color:'#3730A3',aliases:['OneCard','One Card Metal'],archived:false}];
const load=()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cards)return s}catch(e){}return{cards:seedCards(),txns:[],links:[],processed:[],updatedAt:0}};
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};
const Amt=({p,c,cls=''})=><span className={'mono '+cls} style={{color:c}}>{inr(p)}</span>;
const Modal=({title,onClose,children})=><div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{background:'rgba(28,27,24,.45)'}} onClick={onClose}>
 <div className="card w-full sm:max-w-lg max-h-[90vh] overflow-auto p-5" onClick={e=>e.stopPropagation()}>
 <div className="flex justify-between items-center mb-3"><h3 className="serif text-xl font-bold">{title}</h3><button className="btn" onClick={onClose}>Close</button></div>{children}</div></div>;

function QA(){
 const t=[
  ['Parsing: TSV + zero/footer skip + negative DR → CR',()=>{const r=AX.parseAxio(SAMPLE,[]);const rev=r.rows.find(x=>x.place==='AMAZON REFUND');
    const csv=AX.parseAxio('DATE,PLACE,AMOUNT,DR/CR,ACCOUNT\n2026-01-01,"A, B",10.5,DR,X\nPOWERED BY axio https://axio.co.in',[]);
    return[r.rows.length===7&&r.skipped.zero===1&&r.skipped.footer===1&&rev&&rev.drcr==='CR'&&rev.paise===50&&csv.rows.length===1&&csv.rows[0].place==='A, B'&&csv.rows[0].paise===1050,`rows=${r.rows.length}, skipped=${JSON.stringify(r.skipped)}`]}],
  ['Alias: "ICICI credit 8007" → ICICI Amazon Pay',()=>{const c=seedCards();const id=AX.matchCard('ICICI credit 8007',c);return[id===c[0].id&&AX.matchCard('icici 8007 ',c)===c[0].id&&AX.matchCard('Nope',c)===null,'exact + substring']}],
  ['Ordinals: 1st 2nd 3rd 11th 22nd',()=>{const o=[1,2,3,11,21,22,23,12,13].map(ord);return[o.join()==='1st,2nd,3rd,11th,21st,22nd,23rd,12th,13th',o.join(' ')]}],
  ['Subset-sum in integer paise',()=>{const s=AX.subset([{id:'a',paise:64050},{id:'b',paise:85950},{id:'c',paise:149900}],150000);const m=AX.subset([{id:'a',paise:10}],99);return[s&&s.length===2&&s.includes('a')&&s.includes('b')&&m===null,JSON.stringify(s)]}],
  ['Signed net balance is not clamped',()=>{const tx=[{cardId:'1',drcr:'DR',paise:10000},{cardId:'1',drcr:'CR',paise:19000}];const n=AX.net('1',tx);return[n===-9000&&AX.inr(n)==='-₹90.00'&&AX.inr(15000000)==='₹1,50,000.00',AX.inr(n)]}],
  ['Dedupe fingerprint stable',()=>{const a=AX.parseAxio(SAMPLE,[]).rows,b=AX.parseAxio(SAMPLE,[]).rows;return[a.every((x,i)=>x.fp===b[i].fp),'re-import yields same fingerprints']}]
 ].map(([n,f])=>{try{const[ok,d]=f();return{n,ok:!!ok,d}}catch(e){return{n,ok:false,d:String(e)}}});
 return <div>{t.map(x=><div key={x.n} className="flex gap-2 py-2 border-b" style={{borderColor:'var(--bd)'}}><b style={{color:x.ok?'var(--ok)':'var(--due)'}}>{x.ok?'PASS':'FAIL'}</b><div><div className="text-sm">{x.n}</div><div className="text-xs mono" style={{color:'var(--mut)'}}>{x.d}</div></div></div>)}</div>;
}

function CardForm({card,onSave,onClose}){
 const [f,setF]=useState(card?{...card,limitR:card.limit/100,al:card.aliases.join(', ')}:{name:'',limitR:100000,stmt:1,due:20,color:'#C84B31',al:''});
 const u=k=>e=>setF({...f,[k]:e.target.value});
 const day=v=>Math.min(31,Math.max(1,parseInt(v)||1));
 return <Modal title={card?'Edit card':'Add card'} onClose={onClose}><div className="grid grid-cols-2 gap-3">
  <div className="col-span-2"><label className="lbl">Card name</label><input className="inp" value={f.name} onChange={u('name')}/></div>
  <div><label className="lbl">Credit limit (₹)</label><input className="inp mono" type="number" value={f.limitR} onChange={u('limitR')}/></div>
  <div><label className="lbl">Accent colour</label><input className="inp" type="color" value={f.color} onChange={u('color')}/></div>
  <div><label className="lbl">Statement day ({ord(day(f.stmt))})</label><input className="inp" type="number" min="1" max="31" value={f.stmt} onChange={u('stmt')}/></div>
  <div><label className="lbl">Due day ({ord(day(f.due))})</label><input className="inp" type="number" min="1" max="31" value={f.due} onChange={u('due')}/></div>
  <div className="col-span-2"><label className="lbl">Axio account aliases (comma-separated)</label><input className="inp" value={f.al} onChange={u('al')}/></div>
  <button className="btn pri col-span-2" disabled={!f.name.trim()} onClick={()=>onSave({id:card?.id||uid(),name:f.name.trim(),limit:toPaise(f.limitR)||0,stmt:day(f.stmt),due:day(f.due),color:f.color,aliases:f.al.split(',').map(s=>s.trim()).filter(Boolean),archived:!!card?.archived})}>Save card</button></div></Modal>;
}

function MatchDrawer({credit,s,onLink,onClose}){
 const open=s.txns.filter(t=>t.cardId===credit.cardId&&t.drcr==='DR'&&spendLeft(t,s.links)>0);
 const left=creditLeft(credit,s.links);
 const bundle=subset(open.map(t=>({id:t.id,paise:spendLeft(t,s.links)})),left);
 return <Modal title={`Match ${inr(left)} payoff`} onClose={onClose}>
  {bundle&&<div className="card p-3 mb-3" style={{background:'var(--st)'}}><div className="text-sm mb-2">Exact bundle: {bundle.length} spend(s) add up to this payoff.</div>
   <button className="btn pri" onClick={()=>{onLink(bundle.map(id=>({spendId:id,creditId:credit.id,amountPaise:spendLeft(s.txns.find(t=>t.id===id),s.links)})));onClose()}}>Link bundle</button></div>}
  {open.length===0&&<p className="text-sm" style={{color:'var(--mut)'}}>No open spends on this card.</p>}
  {open.map(t=><div key={t.id} className="flex justify-between items-center py-2 border-b gap-2" style={{borderColor:'var(--bd)'}}>
   <div className="text-sm min-w-0"><div className="truncate">{t.place}</div><div className="text-xs" style={{color:'var(--mut)'}}>{t.date}</div></div>
   <Amt p={spendLeft(t,s.links)}/><button className="btn" onClick={()=>{onLink([{spendId:t.id,creditId:credit.id,amountPaise:Math.min(spendLeft(t,s.links),creditLeft(credit,s.links))}]);onClose()}}>Link</button></div>)}
 </Modal>;
}

function App(){
 const [s,setS]=useState(load);const [filter,setFilter]=useState(null);const [modal,setModal]=useState(null);const [paste,setPaste]=useState('');
 const [msg,setMsg]=useState('');const [resetArm,setResetArm]=useState(false);
 const [cfg,setCfg]=useState(()=>{try{return{clientId:'',folder:'Axio Card Exports',poll:5,...JSON.parse(localStorage.getItem(CFG))}}catch(e){return{clientId:'',folder:'Axio Card Exports',poll:5}}});
 const fileRef=useRef(),restoreRef=useRef();
 const commit=fn=>setS(p=>{const n={...fn(p),updatedAt:Date.now()};localStorage.setItem(KEY,JSON.stringify(n));return n});
 const saveCfg=c=>{setCfg(c);localStorage.setItem(CFG,JSON.stringify(c))};
 const toast=m=>{setMsg(m);setTimeout(()=>setMsg(''),4000)};
 const active=s.cards.filter(c=>!c.archived);
 const nets=Object.fromEntries(s.cards.map(c=>[c.id,net(c.id,s.txns)]));
 const unl=id=>s.txns.filter(t=>t.drcr==='CR'&&(id==null||t.cardId===id)&&creditLeft(t,s.links)>0);
 const dues=active.reduce((a,c)=>a+Math.max(0,nets[c.id]),0),sur=active.reduce((a,c)=>a+Math.min(0,nets[c.id]),0);
 const pool=unl().reduce((a,t)=>a+creditLeft(t,s.links),0),lim=active.reduce((a,c)=>a+c.limit,0),util=lim?dues/lim*100:0;
 const rows=s.txns.filter(t=>!filter||t.cardId===filter).slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

 const doImport=text=>{const r=parseAxio(text,s.cards);if(r.error)return toast(r.error);
  let added=0;commit(p=>{const seen=new Set(p.txns.map(t=>t.fp));const n=r.rows.filter(t=>!seen.has(t.fp)&&seen.add(t.fp));added=n.length;return{...p,txns:[...p.txns,...n]}});
  setTimeout(()=>toast(`Imported ${added} new · ${r.rows.length-added} duplicates · ${r.skipped.zero} zero-amount · ${r.skipped.footer} footer · ${r.skipped.neg} reversals→credit`),0);};
 const onFiles=async e=>{for(const f of e.target.files){doImport(await f.text());commit(p=>({...p,processed:[...p.processed,{name:f.name,at:new Date().toISOString()}]}))}e.target.value='';setModal(null)};
 const saveCard=c=>{commit(p=>{const cards=p.cards.some(x=>x.id===c.id)?p.cards.map(x=>x.id===c.id?c:x):[...p.cards,c];
   return{...p,cards,txns:p.txns.map(t=>t.cardId&&cards.some(x=>x.id===t.cardId)?t:{...t,cardId:AX.matchCard(t.account,cards)})}});setModal(null)};
 const archive=c=>{if(nets[c.id]!==0||unl(c.id).length)return toast(`Can't archive ${c.name}: net due must be ₹0.00 and no unlinked credits remain.`);commit(p=>({...p,cards:p.cards.map(x=>x.id===c.id?{...x,archived:true}:x)}));if(filter===c.id)setFilter(null)};
 const link=ls=>commit(p=>({...p,links:[...p.links,...ls.map(l=>({id:uid(),...l}))]}));
 const auto=()=>{const nl=autoMatch(active,s.txns,s.links);if(!nl.length)return toast('No exact matches found.');link(nl);toast(`Auto-linked ${nl.length} spend(s).`)};
 const exportCsv=()=>{const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;const nm=Object.fromEntries(s.cards.map(c=>[c.id,c.name]));
  dl('axio_reconciled.csv',['DATE,TIME,PLACE,AMOUNT,DR/CR,ACCOUNT,CARD,STATUS,REIMBURSEMENT NOTE',...rows.map(t=>[t.date,t.time,t.place,(t.paise/100).toFixed(2),t.drcr,t.account,nm[t.cardId]||'',(t.drcr==='DR'?spendLeft(t,s.links):creditLeft(t,s.links))===0?'settled':'open',t.memo].map(q).join(','))].join('\n'),'text/csv')};
 const restore=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.cards||!j.txns)throw 0;commit(()=>({links:[],processed:[],...j}));toast('Backup restored.')}catch(x){toast('That file is not a ledger backup.')}e.target.value=''};
 const reset=()=>{if(!resetArm){setResetArm(true);setTimeout(()=>setResetArm(false),5000);return}commit(p=>({...p,txns:[],links:[],processed:[]}));setResetArm(false);setFilter(null);toast('Entries cleared. Cards, limits, aliases and Client ID kept.')};

 const kpi=(l,v,c,sub,bar)=><div className="card p-4"><div className="text-xs" style={{color:'var(--mut)'}}>{l}</div><div className="mono text-xl sm:text-2xl mt-1" style={{color:c}}>{v}</div><div className="text-xs mt-1" style={{color:'var(--mut)'}}>{sub}</div>{bar!=null&&<div className="h-1.5 rounded mt-2" style={{background:'var(--st)'}}><div className="h-1.5 rounded" style={{width:Math.min(100,bar)+'%',background:bar>70?'var(--due)':'var(--ok)'}}/></div>}</div>;

 return <div className="max-w-5xl mx-auto px-4 py-5">
  <header className="flex flex-wrap items-center justify-between gap-3 mb-5">
   <div><h1 className="serif text-3xl font-bold">Axio Card Ledger</h1><p className="text-sm" style={{color:'var(--mut)'}}>Who owes what on which card, down to the paisa.</p></div>
   <div className="flex flex-wrap gap-2"><button className="btn pri" onClick={()=>setModal('import')}>Import</button><button className="btn" onClick={auto}>Auto-Match Payoffs</button><button className="btn" onClick={exportCsv}>Export CSV</button>
    <button className="btn" onClick={()=>setModal('sync')}>Backup &amp; Sync</button><button className="btn" onClick={()=>setModal('qa')}>QA Tests</button></div></header>
  {msg&&<div className="card p-3 mb-4 text-sm" role="status" style={{borderColor:'var(--ind)'}}>{msg}</div>}
  <section className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
   {kpi('Total open dues',inr(dues),'var(--due)',`${active.length} active cards`)}
   {kpi('Surplus credits',inr(sur),'var(--ind)','Over-refunds, not clamped')}
   {kpi('Unlinked payoffs pool',inr(pool),'var(--warn)',`${unl().length} unlinked item(s)`)}
   {kpi('Credit utilisation',util.toFixed(1)+'%','var(--ink)',`of ${inr(lim)}`,util)}</section>
  <section className="mb-6"><div className="flex justify-between items-center mb-2"><h2 className="serif text-xl font-bold">Cards</h2>
   <div className="flex gap-2">{filter&&<button className="btn" onClick={()=>setFilter(null)}>Show all cards</button>}<button className="btn" onClick={()=>setModal({card:null})}>Add card</button></div></div>
   <div className="grid sm:grid-cols-3 gap-3">{active.map(c=>{const n=nets[c.id];const u=unl(c.id).length;
    return <div key={c.id} className="card p-4 text-left cursor-pointer" style={{borderTop:`4px solid ${c.color}`,outline:filter===c.id?'2px solid var(--ink)':'none'}} onClick={()=>setFilter(filter===c.id?null:c.id)}>
     <div className="font-semibold text-sm">{c.name}</div>
     <div className="mono text-lg mt-1" style={{color:n>0?'var(--due)':n<0?'var(--ind)':'var(--ok)'}}>{n>0?'Net due ':n<0?'Surplus ':'Settled '}{inr(n)}</div>
     <div className="text-xs mt-1" style={{color:'var(--mut)'}}>Limit {inr(c.limit)} · Statement {ord(c.stmt)} · Due {ord(c.due)}</div>
     {u>0&&<div className="chip mt-2 inline-block" style={{background:'#FEF3C7',color:'var(--warn)'}}>{u} unlinked credit(s)</div>}
     <div className="flex gap-2 mt-3" onClick={e=>e.stopPropagation()}><button className="btn" onClick={()=>setModal({card:c})}>Edit</button><button className="btn" onClick={()=>archive(c)}>Archive</button></div></div>})}</div></section>
  <section><h2 className="serif text-xl font-bold mb-2">Ledger {filter&&<span className="chip">{s.cards.find(c=>c.id===filter)?.name}</span>}</h2>
   {rows.length===0?<div className="card p-6 text-sm" style={{color:'var(--mut)'}}>No transactions yet. Use Import to paste or upload an Axio export.</div>:
   <div className="card divide-y" style={{borderColor:'var(--bd)'}}>{rows.map(t=>{const cr=t.drcr==='CR';const left=cr?creditLeft(t,s.links):spendLeft(t,s.links);const card=s.cards.find(c=>c.id===t.cardId);
    return <div key={t.id} className="p-3 flex flex-wrap items-center gap-x-3 gap-y-1" style={{borderColor:'var(--bd)'}}>
     <div className="flex-1 min-w-[10rem]"><div className="text-sm font-medium">{t.place||'—'}</div>
      <div className="text-xs" style={{color:'var(--mut)'}}>{t.date} {t.time} · {card?card.name:<b style={{color:'var(--warn)'}}>Unmapped: {t.account||'no account'}</b>}</div></div>
     {!cr&&<input className="inp !w-40 !text-xs" placeholder="Reimbursement note" value={t.memo} onChange={e=>commit(p=>({...p,txns:p.txns.map(x=>x.id===t.id?{...x,memo:e.target.value}:x)}))}/>}
     <span className="chip" style={{color:left===0?'var(--ok)':cr?'var(--warn)':'var(--due)'}}>{left===0?'Settled':(cr?'Unlinked ':'Open ')+inr(left)}</span>
     {cr&&left>0&&card&&<button className="btn" onClick={()=>setModal({match:t.id})}>Match</button>}
     <Amt p={cr?-t.paise:t.paise} c={cr?'var(--ok)':'var(--ink)'} cls="w-28 text-right"/></div>})}</div>}</section>

  {modal==='import'&&<Modal title="Import Axio export" onClose={()=>setModal(null)}>
   <input ref={fileRef} type="file" multiple accept=".csv,.tsv,.txt" className="hidden" onChange={onFiles}/>
   <button className="btn pri mb-3" onClick={()=>fileRef.current.click()}>Choose files (.csv, .tsv, .txt)</button>
   <label className="lbl">Or paste rows from your clipboard</label><textarea className="inp mono !text-xs" rows="7" value={paste} onChange={e=>setPaste(e.target.value)}/>
   <div className="flex gap-2 mt-3"><button className="btn pri" disabled={!paste.trim()} onClick={()=>{doImport(paste);setPaste('');setModal(null)}}>Import pasted data</button><button className="btn" onClick={()=>setPaste(SAMPLE)}>Fill with sample</button></div></Modal>}
  {modal==='qa'&&<Modal title="QA tests" onClose={()=>setModal(null)}><QA/></Modal>}
  {modal==='sync'&&<Modal title="Backup & sync" onClose={()=>setModal(null)}>
   <label className="lbl">Google OAuth Client ID (saved on this device)</label><input className="inp mb-2" value={cfg.clientId} onChange={e=>saveCfg({...cfg,clientId:e.target.value})}/>
   <div className="grid grid-cols-2 gap-2 mb-2"><div><label className="lbl">Drive folder</label><input className="inp" value={cfg.folder} onChange={e=>saveCfg({...cfg,folder:e.target.value})}/></div><div><label className="lbl">Poll every (min)</label><input className="inp" type="number" value={cfg.poll} onChange={e=>saveCfg({...cfg,poll:e.target.value})}/></div></div>
   <p className="text-xs mb-3" style={{color:'var(--warn)'}}>Settings are stored; the live Drive connection is not part of this build yet.</p>
   <input ref={restoreRef} type="file" accept=".json" className="hidden" onChange={restore}/>
   <div className="flex flex-wrap gap-2"><button className="btn" onClick={()=>dl('axio_ledger_state.json',JSON.stringify(s,null,1),'application/json')}>Download JSON backup</button><button className="btn" onClick={()=>restoreRef.current.click()}>Restore JSON</button>
    <button className="btn dng" onClick={reset}>{resetArm?'Tap again to confirm reset':'Reset All Ledger Entries'}</button></div>
   {s.processed.length>0&&<div className="mt-4"><div className="text-sm font-semibold mb-1">Safe to delete (already ingested)</div>{s.processed.map((f,i)=><div key={i} className="text-xs mono" style={{color:'var(--mut)'}}>{f.name}</div>)}</div>}</Modal>}
  {modal&&modal.card!==undefined&&<CardForm card={modal.card} onSave={saveCard} onClose={()=>setModal(null)}/>}
  {modal&&modal.match&&<MatchDrawer credit={s.txns.find(t=>t.id===modal.match)} s={s} onLink={link} onClose={()=>setModal(null)}/>}
 </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

/* PWA: manifest (data URI, PNG icons drawn at runtime) + service worker */
(()=>{try{
 const icon=n=>{const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#1C1B18';x.fillRect(0,0,n,n);x.fillStyle='#F7F5F0';x.font=`700 ${n*.6}px serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('₹',n/2,n/2+n*.03);return c.toDataURL('image/png')};
 const base=location.href.split('#')[0].replace(/[^/]*$/,'');
 const m={name:'Axio Card Ledger',short_name:'Card Ledger',display:'standalone',background_color:'#F7F5F0',theme_color:'#F7F5F0',start_url:base,scope:base,icons:[192,512].map(n=>({src:icon(n),sizes:n+'x'+n,type:'image/png',purpose:'any'}))};
 const l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l);
 if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
}catch(e){}})();
</script>
</body></html>
