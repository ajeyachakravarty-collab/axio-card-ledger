<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Axio Card Ledger</title><meta name="theme-color" content="#F7F5F0">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#F7F5F0;--sf:#FFF;--st:#EFECE6;--ink:#1C1B18;--mut:#68645E;--bd:#E2DDD4;--due:#C84B31;--ok:#2D6A4F;--warn:#B45309;--ind:#3730A3}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:Fraunces,serif}.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500}
.btn:hover{background:var(--st)}.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.dng{color:var(--due)}
.inp{border:1px solid var(--bd);background:var(--sf);border-radius:8px;padding:7px 10px;font-size:14px;width:100%}
.lbl{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.chip{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--st);color:var(--mut)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ind);outline-offset:1px}
</style></head>
<body><div id="root"><p style="padding:24px;font-family:Inter,sans-serif;color:#68645E">Loading Axio Card Ledger…</p></div>
<script>addEventListener("error",function(e){var r=document.getElementById("root");if(r&&/Loading/.test(r.textContent))r.innerHTML='<pre style="padding:16px;white-space:pre-wrap;color:#C84B31">Startup error: '+e.message+'</pre>'})</script>

<script>
/* ===== PURE CORE (no React) — also used by the QA suite ===== */
window.AX=(()=>{
const toPaise=v=>{const n=parseFloat(String(v==null?'':v).replace(/[₹,\s]/g,''));return isNaN(n)?NaN:Math.round(n*100)};
const inr=p=>(p<0?'-':'')+'₹'+(Math.abs(p)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ord=n=>{const m=n%100;if(m>=11&&m<=13)return n+'th';return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th')};
const paidExt=t=>t.drcr==='DR'&&/^no$/i.test(t.exp||'')&&!t.forceOpen;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function parseRows(text){
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const d=first.includes('\t')&&(first.match(/\t/g).length>=(first.match(/,/g)||[]).length)?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  row.push(f);rows.push(row);
  return rows.filter(r=>r.some(x=>x.trim()));
}
function matchCard(account,cards){
  const a=(account||'').trim().toLowerCase();if(!a)return null;
  const names=c=>[c.name,...(c.aliases||[])].map(s=>s.trim().toLowerCase()).filter(Boolean);
  for(const c of cards)if(names(c).includes(a))return c.id;
  for(const c of cards)if(names(c).some(n=>n.length>=3&&(a.includes(n)||n.includes(a))))return c.id;
  return null;
}
const fp=t=>[t.date,t.time,t.place,t.paise,t.drcr,t.account].map(x=>String(x).trim().toLowerCase()).join('|');
function parseAxio(text,cards){
  const rows=parseRows(text||'');const out=[];const skipped={zero:0,footer:0,neg:0};const cnt={};
  const hi=rows.findIndex(r=>r.some(c=>/^date$/i.test(c.trim())));if(hi<0)return{rows:out,skipped,error:'No DATE header found'};
  const H={};rows[hi].forEach((c,i)=>H[c.trim().toUpperCase()]=i);
  const g=(r,k)=>H[k]==null?'':(r[H[k]]||'').trim();
  for(const r of rows.slice(hi+1)){
    if(r.some(c=>/powered by axio/i.test(c))||/axio\.co\.in/i.test(r.join(' '))){skipped.footer++;continue}
    let raw=g(r,'AMOUNT')||g(r,'EXPENSE')||g(r,'INCOME');let p=toPaise(raw);
    if(isNaN(p))continue;
    let drcr=g(r,'DR/CR').toUpperCase()||(g(r,'INCOME')&&!g(r,'EXPENSE')?'CR':'DR');
    if(p===0){skipped.zero++;continue}
    if(drcr==='DR'&&p<0){drcr='CR';p=Math.abs(p);skipped.neg++}
    else if(p<0)p=Math.abs(p);
    const t={date:g(r,'DATE'),time:g(r,'TIME'),place:g(r,'PLACE'),paise:p,drcr,account:g(r,'ACCOUNT'),category:g(r,'CATEGORY'),tags:g(r,'TAGS'),note:g(r,'NOTE'),memo:'',exp:/^(yes|no)$/i.test(g(r,'EXPENSE'))?g(r,'EXPENSE'):''};
    const bf=fp(t);cnt[bf]=(cnt[bf]||0)+1;t.fp=cnt[bf]>1?bf+'|#'+cnt[bf]:bf;t.id=uid();t.cardId=matchCard(t.account,cards);out.push(t);
  }
  return{rows:out,skipped};
}
const net=(cid,tx)=>tx.filter(t=>t.cardId===cid&&!paidExt(t)).reduce((s,t)=>s+(t.drcr==='DR'?t.paise:-t.paise),0);
function subset(items,target,max=5){ // items:[{id,paise}] -> ids[]|null, exact integer paise
  const a=items.filter(i=>i.paise>0&&i.paise<=target).sort((x,y)=>y.paise-x.paise);let hit=null,n=0;
  (function go(i,sum,pick){if(hit||n++>200000)return;if(sum===target){hit=pick.slice();return}
    if(i>=a.length||pick.length>=max||sum>target)return;
    pick.push(a[i].id);go(i+1,sum+a[i].paise,pick);pick.pop();go(i+1,sum,pick)})(0,0,[]);
  return hit;
}
const used=(links,key,id)=>links.filter(l=>l[key]===id).reduce((s,l)=>s+l.amountPaise,0);
const spendLeft=(t,links)=>paidExt(t)?0:t.paise-used(links,'spendId',t.id);
const creditLeft=(t,links)=>t.paise-used(links,'creditId',t.id);
function autoMatch(cards,tx,links){
  const nl=[];let all=links.slice();
  for(const c of cards){
    for(const cr of tx.filter(t=>t.cardId===c.id&&t.drcr==='CR')){
      let need=creditLeft(cr,all);if(need<=0)continue;
      const open=()=>tx.filter(t=>t.cardId===c.id&&t.drcr==='DR'&&spendLeft(t,all)>0).map(t=>({id:t.id,paise:spendLeft(t,all)}));
      const ids=subset(open(),need);
      if(ids){for(const id of ids){const amt=open().find(o=>o.id===id).paise;const l={id:uid(),spendId:id,creditId:cr.id,amountPaise:amt};nl.push(l);all=[...all,l]}}
    }}
  return nl;
}
return{paidExt,toPaise,inr,ord,uid,parseRows,parseAxio,matchCard,net,subset,autoMatch,spendLeft,creditLeft,fp};
})();
</script>
